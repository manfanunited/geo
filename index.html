<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Песня на карте — онлайн</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
html,body{margin:0;background:#f6f4ef;color:#1d1d1b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 8px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sc{background:#fff;border-radius:10px;padding:6px 12px;font-weight:600}
button{font:inherit;background:#1d1d1b;color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.alt{background:#fff;color:#1d1d1b;border:1px solid #ccc}
.card{background:#fff;border-radius:12px;padding:16px;max-width:480px}
input,select{font:inherit;padding:8px 10px;border:1px solid #ccc;border-radius:8px}
#map{height:60vh;min-height:360px;border-radius:10px;background:#a9cde6;cursor:crosshair}
.leaflet-container{background:#a9cde6;font:inherit}
.leaflet-container path:focus,.leaflet-interactive:focus{outline:none}
.leaflet-tooltip.cap{background:none;border:0;box-shadow:none;font-size:11px;color:#222;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;padding:0}
.leaflet-tooltip-right.cap:before{display:none}
.cn{width:0;height:0}
.cn span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.04em;color:#4a4636;opacity:.85;text-shadow:0 0 3px #fff,0 0 3px #fff}
.msg{margin:10px 0;min-height:44px;line-height:1.6}
[hidden]{display:none!important}
</style></head><body><main>
<h1>🎵 Песня на карте — онлайн</h1>

<section id="home" class="card">
<p style="margin-top:0">Ваше имя:<br><input id="name" maxlength="16" placeholder="Имя"></p>
<div class="bar"><button id="create">Создать комнату</button></div>
<p>или войти по коду:</p>
<div class="bar"><input id="code" maxlength="4" placeholder="Код" style="width:90px;text-transform:uppercase"><button id="join">Войти</button></div>
<p id="hmsg" style="min-height:22px"></p>
</section>

<section id="lobby" class="card" hidden>
<div class="bar">Код комнаты: <b id="rc" style="font-size:28px;letter-spacing:.1em"></b> <button id="copy" class="alt">Скопировать ссылку</button></div>
<div style="font-weight:600;margin:8px 0">Игроки</div>
<div class="bar" id="plist"></div>
<div id="hostopts">
<p>Раундов: <select id="rounds"><option>3</option><option selected>5</option><option>8</option><option>10</option><option>15</option></select>
&nbsp; Таймер раунда: <select id="timer"><option value="0">нет</option><option value="30">30 с</option><option value="60" selected>60 с</option><option value="90">90 с</option></select></p>
<p id="info" style="font-size:13px;opacity:.75"></p>
<button id="start">Начать игру</button>
</div>
<p id="wait" hidden>Ждём, пока хост начнёт игру…</p>
<p><button id="leave" class="alt">Выйти</button></p>
</section>

<section id="game" hidden>
<div class="bar" id="scores"></div>
<div class="bar"><span id="rd"></span><span id="timerTxt"></span><span id="status"></span></div>
<div class="bar"><button id="play" disabled>Загрузка…</button><label>🔊 <input type="range" id="vol" min="0" max="100" value="70"></label><button id="confirm" disabled>Подтвердить ответ</button></div>
<div id="map"></div>
<div class="msg" id="msg"></div>
<button id="next" hidden></button> <button id="quit" class="alt">Выйти из игры</button>
<p style="font-size:12px;opacity:.7">Колёсико мыши — масштаб, перетаскивание — сдвиг. Поставьте точку (её можно передвинуть) и нажмите «Подтвердить ответ». Очки: 5000·e^(−расстояние/1500 км).</p>
</section>

function info(){const n=Object.keys(dead).length;$("info").innerHTML="Песен в базе: "+S.length+(n?". Исключено недоступных: "+n+' (<a href="#" id="rs">сбросить</a>)':"");const r=$("rs");if(r)r.onclick=e=>{e.preventDefault();dead={};try{localStorage.removeItem("sgdead")}catch(x){}info()}}
info();
function jsonp(u,ok,err){const n="cb"+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement("script"),t=setTimeout(()=>{clean();err()},8000);function clean(){clearTimeout(t);delete window[n];s.remove()}window[n]=d=>{clean();ok(d)};s.onerror=()=>{clean();err()};s.src=u+"&callback="+n;document.head.appendChild(s)}
function find(d,x){const ks=x[5]||[x[1].toLowerCase().replace(/^the /,"").split(/[ ,&]/)[0]];return(d.results||[]).filter(r=>{const a=(r.artistName||"").toLowerCase();return r.previewUrl&&ks.some(k=>a.indexOf(k)>-1)})[0]}
function look(x,cb){let i=0,he=false;const tries=["","&country=RU"];
const nxt=()=>{if(++i<tries.length)go();else cb(he?"err":null)};
const go=()=>jsonp("https://itunes.apple.com/search?media=music&entity=song&limit=25&term="+encodeURIComponent(x[0]+" "+x[1])+tries[i],d=>{const m=find(d,x);if(m)cb(m.previewUrl);else nxt()},()=>{he=true;nxt()});
go()}
function dist(a,b,c,d){const r=Math.PI/180,x=Math.pow(Math.sin((c-a)*r/2),2)+Math.cos(a*r)*Math.cos(c*r)*Math.pow(Math.sin((d-b)*r/2),2);return 12742*Math.asin(Math.sqrt(x))}
const pts=d=>Math.round(5000*Math.exp(-d/1500));

/* ---- сеть ---- */
function genCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function cleanup(){try{peer&&peer.destroy()}catch(e){}peer=null;if(G.iv)clearInterval(G.iv);G={};conns={};hostConn=null;players=[];phase="home";ui="home";canGuess=false;au.pause();au.removeAttribute("src");layer.clearLayers();show("home")}
function bye(t){cleanup();hmsg(t)}
function broadcast(m){Object.values(conns).forEach(c=>{if(c.open)c.send(m)})}
function emit(m){broadcast(m);handle(m)}
function createRoom(){isHost=true;const nm=getName();hmsg("Создаём комнату…");
const tryCode=()=>{code=genCode();peer=new Peer("sgeo-"+code,PCFG);
peer.on("open",()=>{myId="H";players=[{id:"H",name:nm,color:0,total:0}];phase="lobby";emit({t:"lobby",code,players})});
peer.on("connection",hostConnection);
peer.on("error",e=>{if(e.type=="unavailable-id"){try{peer.destroy()}catch(x){}tryCode()}else if(ui=="home")hmsg("Ошибка сети: "+e.type+". Попробуйте ещё раз.")})};
tryCode()}
function hostConnection(c){conns[c.peer]=c;c.on("data",m=>hostData(c,m));c.on("close",()=>dropPlayer(c.peer));c.on("error",()=>dropPlayer(c.peer))}
function hostData(c,m){
if(m.t=="join"){
if(phase!="lobby"){c.send({t:"err",msg:"Игра уже идёт. Попросите хоста дождаться конца и зайдите снова."});setTimeout(()=>c.close(),400);return}
if(players.length>=8){c.send({t:"err",msg:"В комнате уже 8 игроков."});setTimeout(()=>c.close(),400);return}
if(players.some(p=>p.id==c.peer))return;
const used=players.map(p=>p.color);let ci=0;while(used.includes(ci))ci++;
players.push({id:c.peer,name:String(m.name||"Игрок").slice(0,16),color:ci,total:0});
emit({t:"lobby",code,players})}
else if(m.t=="guess")onGuess(c.peer,m.lat,m.lng)}
function dropPlayer(id){delete conns[id];const i=players.findIndex(p=>p.id==id);if(i<0)return;players.splice(i,1);
if(phase=="lobby"){emit({t:"lobby",code,players});return}
if(G.guesses)delete G.guesses[id];
emit({t:"players",players,done:Object.keys(G.guesses||{})});
if(phase=="play"&&players.length&&allDone())reveal()}
const allDone=()=>players.every(p=>G.guesses[p.id]);
function onGuess(id,lat,lng){if(phase!="play"||G.guesses[id]||!players.some(p=>p.id==id)||typeof lat!="number"||typeof lng!="number")return;G.guesses[id]=[lat,lng];emit({t:"prog",done:Object.keys(G.guesses)});if(allDone())reveal()}
function startGame(){G={R:+$("rounds").value,timer:+$("timer").value,rnd:-1,pool:S.filter(x=>!dead[sk(x)]).sort(()=>Math.random()-.5),guesses:{}};players.forEach(p=>p.total=0);nextRound()}
function nextRound(){G.rnd++;G.guesses={};phase="prep";emit({t:"prep",n:G.rnd+1,R:G.R,players});pick(0)}
function pick(errs){const t=++tok;
if(!G.pool.length){phase="lobby";emit({t:"lobby",code,players});emit({t:"msg",text:"Закончились доступные песни."});return}
const s=G.pool.pop();
look(s,r=>{if(t!=tok||phase!="prep")return;
if(r==="err"){G.pool.push(s);if(errs>=3){emit({t:"prep",n:G.rnd+1,R:G.R,players,note:"Не удаётся связаться с iTunes. Хост, проверьте интернет и нажмите «Повторить»."});const n=$("next");n.hidden=false;n.textContent="↻ Повторить";n.onclick=()=>{n.hidden=true;emit({t:"prep",n:G.rnd+1,R:G.R,players});pick(0)};return}setTimeout(()=>pick(errs+1),1500);return}
if(r===null){markDead(s);pick(errs);return}
G.song=s;phase="play";G.left=G.timer;
emit({t:"round",n:G.rnd+1,R:G.R,url:r,timer:G.timer,players});
if(G.timer>0){clearInterval(G.iv);G.iv=setInterval(()=>{G.left--;emit({t:"tick",left:G.left});if(G.left<=0){clearInterval(G.iv);reveal()}},1000)}})}
function reveal(){if(phase!="play")return;phase="rev";clearInterval(G.iv);const s=G.song;
const res=players.map(p=>{const g=G.guesses[p.id];let d=null,pt=0;if(g){d=dist(g[0],g[1],s[3],s[4]);pt=pts(d);p.total+=pt}return{id:p.id,name:p.name,color:p.color,lat:g?g[0]:null,lng:g?g[1]:null,d,p:pt}});
emit({t:"rev",song:{title:s[0],artist:s[1],place:s[2],lat:s[3],lng:s[4]},res,players,last:G.rnd+1>=G.R})}
function hostNext(){if(phase!="rev")return;if(G.rnd+1>=G.R){phase="lobby";emit({t:"lobby",code,players})}else nextRound()}
function joinRoom(c){isHost=false;const nm=getName();code=c.toUpperCase().trim();if(code.length!=4){hmsg("Введите код из 4 символов.");return}
hmsg("Подключаемся…");peer=new Peer(PCFG);
const to=setTimeout(()=>{bye("Не удалось подключиться. Проверьте код или попробуйте ещё раз.")},20000);
peer.on("open",id=>{myId=id;hostConn=peer.connect("sgeo-"+code,{reliable:true});
hostConn.on("open",()=>{clearTimeout(to);hostConn.send({t:"join",name:nm})});
hostConn.on("data",handle);
hostConn.on("close",()=>{if(ui!="home")bye("Хост отключился.")})});
peer.on("error",e=>{clearTimeout(to);if(ui=="home"||ui=="")hmsg(e.type=="peer-unavailable"?"Комната с таким кодом не найдена.":"Ошибка сети: "+e.type);else if(e.type!="peer-unavailable")bye("Связь потеряна: "+e.type)})}

/* ---- интерфейс (одинаков у хоста и у игроков) ---- */
function drawScores(){$("scores").innerHTML=players.map(p=>'<span class="sc" style="color:'+COL[p.color]+'">'+esc(p.name)+(p.id==myId?" (вы)":"")+": "+(p.total||0)+(canGuess&&answered.includes(p.id)?" ✓":"")+"</span>").join("")}
function showLobby(){ui="lobby";show("lobby");$("rc").textContent=code;$("plist").innerHTML=players.map(p=>'<span class="sc" style="color:'+COL[p.color]+'">'+esc(p.name)+(p.id==myId?" (вы)":"")+(p.total?" — "+p.total:"")+"</span>").join("");$("hostopts").hidden=!isHost;$("wait").hidden=isHost;$("start").disabled=false}
function handle(m){switch(m.t){
case"lobby":players=m.players;code=m.code||code;canGuess=false;au.pause();showLobby();break;
case"players":players=m.players;answered=m.done||answered;drawScores();break;
case"err":bye(m.msg);break;
case"msg":alert(m.text);break;
case"prep":ui="game";players=m.players;show("game");canGuess=false;confirmed=false;mine=null;tent=null;answered=[];layer.clearLayers();map.invalidateSize();map.setView([25,10],2);au.pause();au.removeAttribute("src");btn.disabled=true;btn.textContent="Загрузка…";$("confirm").disabled=true;$("confirm").textContent="Подтвердить ответ";$("next").hidden=true;$("rd").textContent="Раунд "+m.n+" из "+m.R;$("timerTxt").textContent="";$("status").textContent="";$("msg").textContent=m.note||"Подбираем песню…";drawScores();break;
case"round":players=m.players;au.src=m.url;btn.disabled=false;btn.textContent="▶ Старт";canGuess=true;$("msg").textContent="Нажмите «Старт», послушайте, поставьте точку на карте и нажмите «Подтвердить ответ».";$("timerTxt").textContent=m.timer?"⏱ "+m.timer+" с":"";$("status").textContent="Ответили: 0 из "+players.length;drawScores();break;
case"prog":answered=m.done;$("status").textContent="Ответили: "+answered.length+" из "+players.length;drawScores();break;
case"tick":$("timerTxt").textContent="⏱ "+Math.max(0,m.left)+" с";break;
case"rev":showRev(m);break}}
function showRev(m){canGuess=false;au.pause();btn.textContent="▶ Старт";players=m.players;answered=[];layer.clearLayers();tent=null;$("confirm").disabled=true;$("timerTxt").textContent="";$("status").textContent="";
const b=[[m.song.lat,m.song.lng]];
m.res.forEach(r=>{if(r.lat==null)return;L.polyline([[r.lat,r.lng],[m.song.lat,m.song.lng]],{pane:"guess",color:COL[r.color],weight:2,dashArray:"5 5"}).addTo(layer);mk(r.lat,r.lng,COL[r.color],7,r.name+": "+Math.round(r.d)+" км");b.push([r.lat,r.lng])});
mk(m.song.lat,m.song.lng,"#1a9c4b",9,m.song.place);
if(b.length>1)map.fitBounds(b,{padding:[60,60],maxZoom:6});else map.setView(b[0],4);
const rs=m.res.slice().sort((x,y)=>(x.d==null)-(y.d==null)||x.d-y.d);
let h="<b>"+esc(m.song.title)+"</b> — "+esc(m.song.artist)+" (зелёная точка: "+esc(m.song.place)+")<br>"+rs.map(r=>who(r)+": "+(r.d==null?"не ответил(а), +0":Math.round(r.d)+" км, +"+r.p)).join("<br>");
if(m.last){const mx=Math.max.apply(null,players.map(p=>p.total)),w=players.filter(p=>p.total==mx);h+="<br><b>Итог: "+(players.length==1?"набрано "+mx+" очков":w.length>1?"ничья между "+w.map(who).join(", "):"победил(а) "+who(w[0]))+"!</b>"}
$("msg").innerHTML=h;drawScores();
const n=$("next");if(isHost){n.hidden=false;n.textContent=m.last?"Вернуться в лобби":"Следующий раунд";n.onclick=hostNext}else{n.hidden=true;$("status").textContent="Ждём, пока хост продолжит…"}}
btn.onclick=()=>{if(au.paused&&au.getAttribute("src")){au.play();btn.textContent="⏸ Пауза"}else{au.pause();btn.textContent="▶ Старт"}};
au.onended=()=>{btn.textContent="▶ Старт"};
$("confirm").onclick=()=>{if(!mine||confirmed||!canGuess)return;confirmed=true;$("confirm").disabled=true;$("confirm").textContent="Ответ отправлен ✓";if(isHost)onGuess("H",mine[0],mine[1]);else if(hostConn&&hostConn.open)hostConn.send({t:"guess",lat:mine[0],lng:mine[1]})};
$("create").onclick=createRoom;
$("join").onclick=()=>joinRoom($("code").value);
$("start").onclick=()=>{if(phase!="lobby")return;$("start").disabled=true;startGame()};
$("leave").onclick=()=>cleanup();
$("quit").onclick=()=>{if(confirm("Выйти из игры?"))cleanup()};
$("copy").onclick=()=>{const u=location.href.split("#")[0]+"#"+code,t="Заходи в игру «Песня на карте»: "+u+" (код комнаты "+code+")";if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{$("copy").textContent="Скопировано ✓"},()=>prompt("Скопируйте:",t));else prompt("Скопируйте:",t)};
</script></main></body></html>
